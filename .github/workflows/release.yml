name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for a manual release (e.g. feedglance-v0.2.1). Leave blank to auto-bump from conventional commits.'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Step 1: Compute the next version from conventional commits and tag ──
  # Replaces release-please: instead of opening a PR, we analyse commits since
  # the last tag, bump semver (feat→minor, fix/perf→patch, BREAKING→major),
  # sync version files, commit, and push a tag — all on the same push to main.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.bump.outputs.release_created }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version and tag
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          TAG_PREFIX="feedglance-v"

          # ── Manual dispatch with an explicit tag: use it verbatim. ──
          if [ -n "${MANUAL_TAG:-}" ]; then
            NEW_TAG="$MANUAL_TAG"
            NEW_VERSION="${NEW_TAG#"$TAG_PREFIX"}"
            echo "Manual release requested: $NEW_TAG"
          else
            # ── Find the most recent version tag. ──
            LAST_TAG="$(git tag --list "${TAG_PREFIX}*" --sort=-version:refname | head -n1)"
            if [ -z "$LAST_TAG" ]; then
              LAST_VERSION="0.0.0"
              RANGE=""
              echo "No existing tag found; starting from 0.0.0"
            else
              LAST_VERSION="${LAST_TAG#"$TAG_PREFIX"}"
              RANGE="${LAST_TAG}..HEAD"
              echo "Last tag: $LAST_TAG (version $LAST_VERSION)"
            fi

            # ── Inspect conventional commits since the last tag. ──
            COMMITS="$(git log --format='%B' ${RANGE} 2>/dev/null || git log --format='%B')"

            # ── Manual override: skip the release if any commit in range opts out. ──
            if echo "$COMMITS" | grep -qiE '\[skip[ -](release|ci)\]'; then
              echo "Found [skip release]/[skip ci] in commit range. Skipping release."
              echo "release_created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            BUMP="none"
            # Major: a "!" before the ":" in the type, or a BREAKING CHANGE footer.
            if echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' \
               || echo "$COMMITS" | grep -qE 'BREAKING[ -]CHANGE'; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
              BUMP="patch"
            fi

            echo "Detected bump: $BUMP"
            if [ "$BUMP" = "none" ]; then
              echo "No release-worthy commits since ${LAST_TAG:-start}. Skipping release."
              echo "release_created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            IFS='.' read -r MAJ MIN PAT <<< "$LAST_VERSION"
            case "$BUMP" in
              major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
              minor) MIN=$((MIN + 1)); PAT=0 ;;
              patch) PAT=$((PAT + 1)) ;;
            esac
            NEW_VERSION="${MAJ}.${MIN}.${PAT}"
            NEW_TAG="${TAG_PREFIX}${NEW_VERSION}"
            echo "New version: $NEW_VERSION  ($NEW_TAG)"
          fi

          # ── Bail out if the tag already exists (e.g. re-run). ──
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists. Skipping release."
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Sync version into the three source-of-truth files. ──
          # package.json
          node -e "const f='package.json';const j=require('./'+f);j.version='$NEW_VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n');"
          # src-tauri/tauri.conf.json
          node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$NEW_VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n');"
          # src-tauri/Cargo.toml — bump the [package] version (first version= line).
          perl -0pi -e 's/^version = "\d+\.\d+\.\d+"/version = "'"$NEW_VERSION"'"/m' src-tauri/Cargo.toml
          # Keep Cargo.lock's feedglance entry in step so CI doesn't drift.
          if command -v cargo >/dev/null 2>&1; then
            (cd src-tauri && cargo update -p feedglance --precise "$NEW_VERSION" 2>/dev/null) || true
          fi

          # ── Commit the version bump and push the tag. ──
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock 2>/dev/null || true
          git commit -m "chore(release): ${NEW_VERSION} [skip ci]" || echo "Nothing to commit"
          git tag "$NEW_TAG"
          git push origin HEAD:main
          git push origin "$NEW_TAG"

          # ── Create a draft release; build job fills it, publish job flips it live. ──
          gh release create "$NEW_TAG" \
            --title "Feedglance $NEW_TAG" \
            --draft --prerelease \
            --generate-notes

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$NEW_TAG" >> "$GITHUB_OUTPUT"

  # ── Step 2: Build Tauri app for all platforms ─────────────────────────
  build-tauri:
    needs: version
    if: needs.version.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag_name }}
          releaseName: 'Feedglance ${{ needs.version.outputs.tag_name }}'
          releaseBody: |
            See the assets below to download and install.

            > **macOS users:** This app is not code-signed. See the [README](https://github.com/protomated/feedglance#running-unsigned-builds) for instructions on how to open unsigned apps.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # ── Step 3: Publish the draft release once all builds succeed ────────
  publish-release:
    needs: [version, build-tauri]
    if: needs.build-tauri.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag_name }}"
          echo "Publishing release for tag: $TAG"

          RELEASE_ID="$(gh api repos/${{ github.repository }}/releases --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)"
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No release found for tag $TAG"
            exit 1
          fi

          # `make_latest` is required, not implied. A draft can never be the
          # latest release, so clearing the draft flag alone leaves GitHub's
          # latest pointer on whatever it was before — which is what
          # `releases/latest/download/latest.json` serves to the updater.
          # v0.7.0 shipped green while that pointer still named v0.6.2, so
          # every client saw "no update available" indefinitely.
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --method PATCH -F draft=false -F prerelease=false -F make_latest=true

          # Assert the pointer actually moved: a silently-stale `latest` is
          # indistinguishable from a healthy release until users stop updating.
          ACTUAL="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)"
          if [ "$ACTUAL" != "$TAG" ]; then
            echo "::error::latest release is $ACTUAL, expected $TAG"
            exit 1
          fi
          echo "Verified: latest release is $ACTUAL"
